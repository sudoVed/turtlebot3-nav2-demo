# Merged with the installed Lyrical nav2_bringup/params/nav2_params.yaml.
controller_server:
  ros__parameters:
    progress_checker:
      required_movement_radius: 0.25
      movement_time_allowance: 20.0
    FollowPath:
      vx_max: 0.30
      vx_min: -0.15
      wz_max: 1.2
      ax_max: 1.0
      ax_min: -1.0
      az_max: 2.0
      visualize: false
      CostCritic:
        cost_weight: 8.0
local_costmap:
  local_costmap:
    ros__parameters:
      width: 4
      height: 4
      robot_radius: 0.23
      inflation_layer:
        inflation_radius: 0.55
        cost_scaling_factor: 3.0
      voxel_layer:
        scan:
          raytrace_max_range: 8.0
          obstacle_max_range: 7.5
global_costmap:
  global_costmap:
    ros__parameters:
      # Preserve a planning canvas beyond the bounds of the growing SLAM map.
      # This carries NO prior occupancy information about the world.
      rolling_window: true
      width: 20
      height: 20
      robot_radius: 0.23
      inflation_layer:
        inflation_radius: 0.50
        cost_scaling_factor: 5.0
      update_frequency: 2.0
      track_unknown_space: true
      obstacle_layer:
        scan:
          raytrace_max_range: 8.0
          obstacle_max_range: 7.5
planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    GridBased:
      plugin: nav2_smac_planner::SmacPlanner2D
      cost_travel_multiplier: 2.0
      max_planning_time: 1.0
      allow_unknown: true
      tolerance: 0.25
velocity_smoother:
  ros__parameters:
    max_velocity: [0.30, 0.0, 1.2]
    min_velocity: [-0.15, 0.0, -1.2]
    max_accel: [1.0, 0.0, 2.0]
    max_decel: [-1.0, 0.0, -2.0]
